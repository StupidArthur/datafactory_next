name: Rust CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build Engine executable for SDK integration tests
        run: cargo build -p df-engine --bin df-engine
      - name: Add Engine executable to PATH (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      - name: Run workspace tests
        run: cargo test --workspace --locked

  frontend:
    name: Studio frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci --prefix frontend
      - name: Typecheck and production build
        run: npm run build --prefix frontend

  go:
    name: Studio Go unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded frontend assets
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Run Go tests
        run: go test ./...
