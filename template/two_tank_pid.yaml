dsl_version: 2
metadata:
  name: 单阀门二阶水箱
  description: PID通过单阀门控制下游水箱液位
clock:
  mode: GENERATOR
  cycle_time: 0.5
program:
  - name: source_flow
    type: Variable
    value: 0.0012
    writable: false
    display_args: []
  - name: pid2
    type: PID
    execute_first: true
    params: {PB: 30.0, TI: 90.0, TD: 20.0, KD: 10.0, MODE: 5, SWPN: 1, SVSCL: 0.0, SVSCH: 1.2, SVL: 0.0, SVH: 1.2, MVSCL: 0.0, MVSCH: 100.0, MVL: 0.0, MVH: 100.0, PV: 0.10, SV: 0.8, MV: 0.0}
    inputs: {PV: tank_2.level}
    display_args: ["MV[100]", "PV[1.2]", "SV[1.2]", MODE]
  - name: valve_1
    type: VALVE
    params: {full_travel_time: 12.0, initial_opening: 0.0}
    inputs: {target_opening: pid2.MV, inlet_flow: source_flow}
    display_args: []
  - name: tank_1
    type: CYLINDRICAL_TANK
    params: {height: 1.2, radius: 0.15, outlet_area: 0.00025, initial_level: 0.15}
    inputs: {inlet_flow: valve_1.outlet_flow}
    display_args: ["level[1.2]"]
  - name: tank_2
    type: CYLINDRICAL_TANK
    params: {height: 1.2, radius: 0.15, outlet_area: 0.0002, initial_level: 0.10}
    inputs: {inlet_flow: tank_1.outlet_flow}
    display_args: ["level[1.2]"]
export:
  default_columns: [pid2.MV, pid2.PV, pid2.SV, valve_1.current_opening, tank_1.level, tank_2.level]
