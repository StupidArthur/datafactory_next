[workspace]
members = ["crates/df-core", "crates/df-sdk", "crates/df-engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
arrow-array = "59.2"
arrow-schema = "59.2"
parquet = { version = "59.2", default-features = false, features = ["arrow", "snap"] }
